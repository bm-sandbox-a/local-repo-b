<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <header>
    <h1>Notes</h1>
    <p id="count" class="count">loading…</p>
  </header>

  <!-- A real form, so that Enter submits and the browser does the required
       field. Rebuilding either in javascript is work in exchange for less. -->
  <form id="new-note" autocomplete="off">
    <input id="title" name="title" type="text" placeholder="Title" required maxlength="200">
    <textarea id="body" name="body" placeholder="Anything else (optional)" rows="2"></textarea>
    <button type="submit">Add</button>
  </form>

  <p id="status" class="status" role="status"></p>

  <ul id="notes" class="notes"></ul>
</main>

<!-- No build step. The same two files the tests require in node, loaded here
     as plain scripts -- see the note at the bottom of each. -->
<script src="../src/api.js"></script>
<script src="../src/render.js"></script>
<script src="app.js"></script>

</body>
</html>
